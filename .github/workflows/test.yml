name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'images/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (VS Code)
        run: xvfb-run -a node ./out/test/runTest.js
